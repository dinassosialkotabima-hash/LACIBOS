<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Tambahan maximum-scale=1.0 untuk mencegah zoom otomatis di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Layanan</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Link Apps Script Anda otomatis memuat penuh di halaman -->

        src="https://script.google.com/macros/s/AKfycbz1Y147dtH1wg1ThGDdTO8ZBhX2m0WXdy3HdnIFncFwCy9mpoTSd3wZkbsPLOaQxiON/exec"

</html>
